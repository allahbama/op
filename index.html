<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff4f6">
  <title>A little surprise ♡</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #513b43;
      background: radial-gradient(circle at top, #fff 0, #fff4f6 48%, #f8e3eb 100%);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(100%, 520px); padding: 54px 30px; text-align: center;
      background: rgba(255,255,255,.78); border: 1px solid #f1d9e1;
      border-radius: 28px; box-shadow: 0 18px 55px rgba(116, 67, 84, .10);
    }
    .heart { font-size: 34px; color: #d77d98; margin-bottom: 20px; }
    .eyebrow {
      font: 11px/1.4 Arial, sans-serif; letter-spacing: .22em;
      text-transform: uppercase; color: #b47a8c; margin-bottom: 18px;
    }
    h1 { font-size: clamp(29px, 7vw, 42px); font-weight: normal; line-height: 1.2; margin: 0 0 24px; }
    p { font-size: clamp(18px, 4.5vw, 21px); line-height: 1.8; margin: 0; }
    .footer { margin-top: 30px; font-size: 22px; color: #d77d98; }
  </style>
</head>
<body>
  <main>
    <div class="heart">♡</div>
    <div class="eyebrow">A little surprise for you</div>
    <h1>Heyyyyy!!!!</h1>
    <p>i made something for you.<br>
    i have worked all night to give you this.<br>
    hehehehe.<br>
    i hope you like it.</p>
    <div class="footer">♡</div>
  </main>
</body>
</html>
